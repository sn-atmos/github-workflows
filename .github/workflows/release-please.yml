---
name: Create release and tag
description: This workflow uses 'release-please' to automatically create a release and tag based on conventional commits.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/release-please.yaml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
