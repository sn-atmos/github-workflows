---
name: Build and publish crossplane package

on:
  workflow_call:
    inputs:
      crossplane_version:
        description: Crossplane CLI version
        type: string
        default: v2.5.0
      package-root:
        description: The directory that contains the package's crossplane.yaml file.
        required: false
        default: apis/
        type: string
      ignore:
        description: Comma-separated file paths, specified relative to package-root, to exclude from the package. Wildcards are supported. Directories cannot be excluded.
        required: false
        default: kustomization.yaml,*/kustomization.yaml,*/*/kustomization.yaml
        type: string
      project:
        type: boolean
        default: false
        description: Build project based on a CrossPlane project file.
      project-file-path:
        type: string
        default: crossplane-project.yaml
        description: The path to the Crossplane Project file.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Extract version from tag
        run: echo "TAG=$(basename $GITHUB_REF_NAME)" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Add local bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Crossplane CLI
        id: cache-crossplane-cli
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/crossplane
          key: crossplane-cli-${{ inputs.crossplane_version }}

      - name: Cache crossplane package schema cache
        uses: actions/cache@v5
        with:
          path: ~/.crossplane/cache
          key: crossplane-${{ inputs.crossplane_version }}

      - name: Cache crossplane cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/crossplane
          key: crossplane-xdg-${{ inputs.crossplane_version }}

      - name: Cache Go build and module cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.run_id }}
          restore-keys: go-

      - name: Install Crossplane CLI
        if: steps.cache-crossplane-cli.outputs.cache-hit != 'true'
        run: >
          curl -sSfLo "$HOME/.local/bin/crossplane"
          https://releases.crossplane.io/stable/${{ inputs.crossplane_version }}/bin/linux_amd64/crossplane
          && chmod +x "$HOME/.local/bin/crossplane"

      - name: Build Configuration package
        if: ${{ !inputs.project }}
        run: crossplane xpkg build --package-file=pkg.xpkg --package-root=${{ inputs.package-root }} --ignore=${{ inputs.ignore }}

      - name: Build Crossplane project
        if: ${{ inputs.project }}
        run: crossplane project build --project-file="${{ inputs.project-file-path }}"

      - name: Push Crossplane Package
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.project
        run: crossplane xpkg push --package-files=pkg.xpkg ghcr.io/${{ github.repository }}:${{ env.TAG }}

      - name: Push Crossplane project
        if: startsWith(github.ref, 'refs/tags/v') && inputs.project
        run: crossplane project push --project-file="${{ inputs.project-file-path }}" --tag="${{ env.TAG }}"
