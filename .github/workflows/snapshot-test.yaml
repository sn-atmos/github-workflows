---
name: Snapshot Test
on:
  workflow_call:
    inputs:
      xtest_version:
        type: string
        default: v0.3.6
      crossplane_version:
        type: string
        default: v2.4.2

jobs:
  snapshot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install deps
        run: >
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          ca-certificates
          curl
          make
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Add local bin to PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache xtest binary
        id: cache-xtest-binary
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/xtest
          key: xtest-binary-${{ inputs.xtest_version }}

      - name: Install xtest
        if: steps.cache-xtest-binary.outputs.cache-hit != 'true'
        run: |
          TMP="$(mktemp -d)"
          oras pull ghcr.io/sn-atmos/xtest_linux_x86_64:${{ inputs.xtest_version }} -o "$TMP"
          cp "$TMP/xtest" "$HOME/.local/bin/xtest"
          chmod +x "$HOME/.local/bin/xtest"
          rm -rf "$TMP"

      - name: Cache Crossplane binary
        id: cache-crossplane-binary
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/crossplane-bin
          key: crossplane-binary-${{ inputs.crossplane_version }}

      - name: Install Crossplane binary
        if: steps.cache-crossplane-binary.outputs.cache-hit != 'true'
        run: >
          curl -sSfo "$HOME/.local/bin/crossplane-bin"
          https://releases.crossplane.io/stable/${{ inputs.crossplane_version }}/bin/linux_amd64/crossplane
          && chmod +x "$HOME/.local/bin/crossplane-bin"

      - name: Cache crossplane package schemas
        uses: actions/cache@v5
        with:
          path: ~/.crossplane/cache
          key: crossplane-${{ inputs.crossplane_version }}

      - name: Cache crossplane
        uses: actions/cache@v5
        with:
          path: ~/.cache/crossplane
          key: crossplane-xdg-${{ inputs.crossplane_version }}

      - name: Cache xtest
        uses: actions/cache@v5
        with:
          path: ~/.cache/xtest
          key: xtest-${{ inputs.xtest_version }}

      - name: Cache Go build and module cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.run_id }}
          restore-keys: go-

      - name: Cache schemas
        uses: actions/cache@v5
        with:
          path: schemas
          key: schemas-crossplane-${{ inputs.crossplane_version }}-xtest-${{ inputs.xtest_version }}

      - name: Test
        run: |
          make test

      - name: Validate
        continue-on-error: true
        run: |
          make validate
