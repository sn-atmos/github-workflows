---
name: Snapshot Test
on:
  workflow_call: {}

jobs:
  snapshot-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install deps
        run: >
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          ca-certificates
          curl
          make
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install xtest
        run: >
          curl -sSfL
          https://github.com/sn-atmos/crossplane/releases/download/v0.5.0/crossplane_0.5.0_linux_amd64.tar.gz
          | tar -xzC /usr/local/bin --transform 's|crossplane|atmos-crossplane|' crossplane

      - name: Install Crossplane binary
        run: >
          curl -sSfo /usr/local/bin/crossplane-bin
          https://releases.crossplane.io/stable/v2.3.2/bin/linux_amd64/crossplane
          | chmod +x /usr/local/bin/crossplane-bin

      - name: Test
        run: |
          make test

      - name: Cache crossplane package schemas
        uses: actions/cache@v5
        with:
          path: ~/.crossplane/cache
          key: crossplane-cache

      - name: Validate
        continue-on-error: true
        run: |
          make validate
