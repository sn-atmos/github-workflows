---
name: Snapshot Test
on:
  workflow_call:
    inputs:
      xtest_version:
        type: string
        default: v0.2.4
      crossplane_version:
        type: string
        default: v2.3.4
      crossplane_cli_version:
        type: string
        default: ""
      test_target:
        type: string
        default: test
      validate:
        type: boolean
        default: true
      artifact_name:
        type: string
        default: test-results
      artifact_path:
        type: string
        default: ""

jobs:
  snapshot-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install deps
        run: >
          sudo apt-get update
          && sudo apt-get install -y --no-install-recommends
          ca-certificates
          curl
          make
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Install xtest
        run: |
          TMP="$(mktemp -d)"
          oras pull ghcr.io/sn-atmos/xtest_linux_x86_64:${{ inputs.xtest_version }} -o "$TMP"
          cp "$TMP/xtest" /usr/local/bin/xtest
          chmod +x /usr/local/bin/xtest
          rm -rf "$TMP"

      - name: Install Crossplane binary
        run: >
          curl -sSfo /usr/local/bin/crossplane-bin
          https://releases.crossplane.io/stable/${{ inputs.crossplane_version }}/bin/linux_amd64/crossplane
          && chmod +x /usr/local/bin/crossplane-bin

      - name: Cache crossplane package schemas
        uses: actions/cache@v5
        with:
          path: ~/.crossplane/cache
          key: crossplane-cache

      - name: Install Crossplane CLI
        if: ${{ inputs.crossplane_cli_version != '' }}
        env:
          CROSSPLANE_CLI_VERSION: ${{ inputs.crossplane_cli_version }}
        run: >
          curl -sSfLo /usr/local/bin/crossplane
          "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          && chmod +x /usr/local/bin/crossplane

      - name: Cache xtest package schemas
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/xtest
            .cache/validation
          key: xtest-${{ runner.os }}-${{ inputs.xtest_version }}-${{ hashFiles('apis/package.yaml', 'Makefile') }}

      - name: Test
        env:
          TEST_TARGET: ${{ inputs.test_target }}
        run: make "$TEST_TARGET"

      - name: Validate
        if: ${{ inputs.validate }}
        continue-on-error: true
        run: |
          make validate

      - name: Upload test results
        if: ${{ always() && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          include-hidden-files: true
          retention-days: 7
